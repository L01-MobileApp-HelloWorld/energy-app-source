name: Test and Coverage

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:

jobs:
  test:
    name: Run Tests and Coverage
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Run tests with coverage
      run: npm run test:ci

    - name: Generate test report
      if: always()
      run: |
        mkdir -p test-reports
        cp coverage/lcov-report/index.html test-reports/index.html
        
        # Create a simple test summary
        echo "<!DOCTYPE html>" > test-reports/summary.html
        echo "<html><head><title>Test Summary</title></head><body>" >> test-reports/summary.html
        echo "<h1>Energy Mobile App - Test Results</h1>" >> test-reports/summary.html
        echo "<p>Generated on: $(date)</p>" >> test-reports/summary.html
        echo "<h2>Coverage Report</h2>" >> test-reports/summary.html
        echo "<p><a href='index.html'>View detailed coverage report</a></p>" >> test-reports/summary.html
        echo "</body></html>" >> test-reports/summary.html

    - name: Upload test report artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-report
        path: |
          test-reports/
          coverage/
        retention-days: 30

    - name: Upload coverage to SonarCloud
      if: success()
      uses: SonarSource/sonarcloud-github-action@master
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      with:
        args: >
          -Dsonar.projectKey=${{ secrets.SONAR_PROJECT_KEY }}
          -Dsonar.organization=${{ secrets.SONAR_ORGANIZATION }}

    - name: Comment Test Results
      if: always() && github.event_name == 'pull_request'
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          
          let comment = '## 🧪 Test Results\n\n';
          
          if (fs.existsSync('coverage/coverage-summary.json')) {
            const coverage = JSON.parse(fs.readFileSync('coverage/coverage-summary.json', 'utf8'));
            const total = coverage.total;
            
            comment += '### 📊 Coverage Summary\n';
            comment += `- **Lines:** ${total.lines.pct}%\n`;
            comment += `- **Statements:** ${total.statements.pct}%\n`;
            comment += `- **Functions:** ${total.functions.pct}%\n`;
            comment += `- **Branches:** ${total.branches.pct}%\n\n`;
          }
          
          comment += '### 🔗 Links\n';
          comment += `- [View Test Report](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})\n`;
          comment += `- [Download Artifacts](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})\n`;
          
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: comment
          });

    - name: Check coverage threshold
      run: |
        if [ -f coverage/coverage-summary.json ]; then
          node -e "
            const coverage = require('./coverage/coverage-summary.json');
            const { lines, statements, functions, branches } = coverage.total;
            const threshold = 70;
            
            console.log('Coverage Summary:');
            console.log('Lines:', lines.pct + '%');
            console.log('Statements:', statements.pct + '%');
            console.log('Functions:', functions.pct + '%');
            console.log('Branches:', branches.pct + '%');
            
            const failed = [lines, statements, functions, branches].filter(metric => metric.pct < threshold);
            
            if (failed.length > 0) {
              console.error('❌ Coverage threshold not met! Required: ' + threshold + '%');
              process.exit(1);
            } else {
              console.log('✅ Coverage threshold met!');
            }
          "
        else
          echo "⚠️  Coverage file not found"
        fi