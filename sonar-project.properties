# SonarCloud organization and project configuration
# Replace with your actual SonarCloud organization key
sonar.organization=your-org-key
# Replace with your actual SonarCloud project key
sonar.projectKey=your-project-key
sonar.projectName=Energy Mobile App
sonar.projectVersion=1.0.0

# Source code location
sonar.sources=app,components
sonar.sourceEncoding=UTF-8

# Test configuration
sonar.tests=app,components
sonar.test.inclusions=**/__tests__/**,**/*.test.tsx,**/*.test.ts,**/*.spec.tsx,**/*.spec.ts

# Exclude files from analysis
sonar.exclusions=**/node_modules/**,**/coverage/**,**/*.test.tsx,**/*.test.ts,**/*.spec.tsx,**/*.spec.ts,**/jest-setup.ts,**/.expo/**,**/.next/**,**/build/**,**/dist/**

# Coverage configuration
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.coverage.exclusions=**/__tests__/**,**/*.test.tsx,**/*.test.ts,**/*.spec.tsx,**/*.spec.ts,**/jest-setup.ts

# Language configuration
sonar.typescript.node=node