sonar.projectKey=Tên_Project_Key_Ở_Bước_1
sonar.organization=Tên_Org_Key_Ở_Bước_1

# Đường dẫn tới file coverage (để hiện % Coverage lên Dashboard)
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.sources=src
sonar.tests=src
sonar.test.inclusions=**/*.test.tsx,**/*.test.ts
sonar.exclusions=**/node_modules/**,**/coverage/**